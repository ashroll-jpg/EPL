<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Highlights">
<meta name="theme-color" content="#040605">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;1,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<title>PL Highlights</title>
<style>
:root{
  --bg:#040605;--s1:#0b0f0d;--s2:#121815;--s3:#1a221e;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --text:#eef3f0;--muted:#7c8a82;--dim:#4d5852;
  --acc:#3df58f;--accbg:rgba(61,245,143,.1);--ink:#02130a;
  --g1:#145a37;--g2:#03110a;--live:#ff3d57;
  --fc:'Barlow Condensed','Arial Narrow',sans-serif;
  --fm:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --fb:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --cut:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.4 var(--fb);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(130% 55% at 50% -12%,rgba(20,90,55,.42),transparent 62%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}

/* Header */
.head{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) 16px 12px;background:linear-gradient(180deg,rgba(4,6,5,.97),rgba(4,6,5,.84));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.mark{width:36px;height:36px;flex:none;display:block}
.brand{flex:1;min-width:0}
.brand small{display:block;font:500 9.5px var(--fm);letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.brand b{display:block;font:italic 800 28px/.95 var(--fc);text-transform:uppercase;letter-spacing:.01em}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line2);background:var(--s1);border-radius:2px;flex:none}
.icon-btn svg{width:18px;height:18px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{padding:0 16px calc(env(safe-area-inset-bottom) + 96px);max-width:640px;margin:0 auto}

/* Matches controls */
.weekbar{display:flex;align-items:center;gap:10px;margin-top:16px}
.wk{flex:1;text-align:center}
.wk .r{font:italic 800 25px/1 var(--fc);text-transform:uppercase}
.wk button{display:block;margin:5px auto 0;font:500 10px var(--fm);letter-spacing:.16em;color:var(--acc);text-transform:uppercase}
.prog{display:flex;align-items:center;gap:12px;margin-top:16px;font:500 10.5px var(--fm);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.prog b{color:var(--text)}
.bar{flex:1;height:3px;background:var(--s3);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);box-shadow:0 0 12px rgba(61,245,143,.6);transition:width .35s}
.chips{display:flex;gap:6px;margin-top:14px}
.chip{padding:8px 11px;border:1px solid var(--line2);font:600 10px var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-radius:2px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.banner{margin-top:16px;padding:12px 14px;border:1px solid rgba(61,245,143,.3);background:var(--accbg);font-size:13.5px}
.banner button{color:var(--acc);font-weight:700;text-decoration:underline}

.lbl{margin:26px 0 10px;font:600 10.5px var(--fm);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.lbl::before{content:"";width:10px;height:2px;background:var(--acc);flex:none}
.lbl::after{content:"";flex:1;height:1px;background:var(--line)}
.lbl.fav{color:var(--acc)}

/* Match card */
.card{position:relative;background:linear-gradient(160deg,var(--s2),var(--s1) 70%);border:1px solid var(--line);margin-bottom:10px;padding:12px 12px 10px;clip-path:var(--cut)}
.card.fav{background:linear-gradient(160deg,rgba(20,90,55,.5),var(--s1) 65%);border-color:rgba(61,245,143,.22)}
.card.fav::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--acc)}
.card.seen .row,.card.seen .meta{opacity:.5}
.row{display:grid;grid-template-columns:1fr 116px;gap:12px;align-items:center}
.teams{min-width:0}
.team{display:flex;align-items:center;gap:10px;height:30px}
.team img,.nologo{width:22px;height:22px;object-fit:contain;flex:none}
.nologo{background:var(--s3);border-radius:50%}
.tn{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team.fav .tn{color:var(--acc)}
.sc{font:700 20px var(--fm);min-width:22px;text-align:right}
.team.lose .tn,.team.lose .sc{color:var(--dim)}
.team.lose.fav .tn{color:rgba(61,245,143,.55)}
.q{display:inline-block;width:15px;height:19px;vertical-align:middle;border:1px solid var(--line2);background:repeating-linear-gradient(135deg,var(--s3) 0 3px,transparent 3px 6px)}
.thumb{position:relative;display:block;width:116px;aspect-ratio:16/9;overflow:hidden;background:var(--s3);border:1px solid var(--line2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.8) contrast(1.05)}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.7))}
.play{position:absolute;z-index:1;inset:0;margin:auto;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.55);border:1.5px solid var(--acc);box-shadow:0 0 14px rgba(61,245,143,.45)}
.play::after{content:"";position:absolute;left:11px;top:8.5px;border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}
.badge{position:absolute;z-index:1;left:6px;bottom:5px;font:700 8.5px var(--fm);letter-spacing:.16em;color:var(--acc)}
.thumb.empty{display:grid;place-items:center;padding:6px;text-align:center;font:500 9px var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);border-style:dashed;background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 6px,transparent 6px 12px)}
.thumb.empty::after{display:none}
.meta{margin-top:10px;font:500 10px var(--fm);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.meta a{color:var(--text);border-bottom:1px solid var(--line2)}
.live{color:var(--live);font-weight:700}
.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--live);margin-right:5px;vertical-align:1px;animation:pulse 1.3s infinite}
@keyframes pulse{50%{opacity:.25}}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.act{display:flex;align-items:center;justify-content:center;gap:8px;height:38px;border:1px solid var(--line2);background:rgba(255,255,255,.02);font:700 15px var(--fc);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-radius:2px;transition:background .15s,color .15s}
.act .box{width:14px;height:14px;border:1.5px solid currentColor;display:grid;place-items:center;flex:none}
.act.on{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.act.on .box::after{content:"";width:3.5px;height:7px;border:solid var(--ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-.5px,-1px)}
.act:disabled{opacity:.3}

.empty-state{text-align:center;color:var(--muted);padding:56px 16px;font:500 11px var(--fm);letter-spacing:.14em;text-transform:uppercase}
.status{text-align:center;font:500 10px var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:20px 0 0}
.status.err{color:#ff8a95}

/* Table */
.tbl{border:1px solid var(--line);background:var(--s1);margin-top:16px}
.tr{display:grid;grid-template-columns:24px minmax(0,1fr) 22px 22px 22px 22px 32px 30px;align-items:center;gap:4px;height:42px;padding:0 10px 0 8px;border-bottom:1px solid var(--line);font:500 12px var(--fm);position:relative;text-align:center;color:var(--muted)}
.tr:last-child{border-bottom:0}
.tr::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;background:var(--z,transparent)}
.tr .pos{color:var(--text)}
.th{height:32px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.tm{display:flex;align-items:center;gap:8px;text-align:left;min-width:0}
.tm img{width:20px;height:20px;object-fit:contain;flex:none}
.tm b{font:600 14px var(--fb);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .tm{font:inherit}
.pts{font-weight:700;color:var(--text)!important}
.tr.fav{background:linear-gradient(90deg,rgba(61,245,143,.13),transparent 80%)}
.tr.fav .tm b{color:var(--acc)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font:500 9.5px var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;margin-right:6px;vertical-align:0}
.gate{margin-top:16px;border:1px solid var(--line2);padding:32px 20px;text-align:center;background:repeating-linear-gradient(135deg,rgba(255,255,255,.02) 0 8px,transparent 8px 16px);clip-path:var(--cut)}
.gate .t{font:italic 800 24px var(--fc);text-transform:uppercase}
.gate p{color:var(--muted);margin:6px 0 18px;font-size:13.5px}

/* Me */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.tile{background:linear-gradient(160deg,var(--s2),var(--s1));border:1px solid var(--line);padding:14px;clip-path:var(--cut)}
.tile .n{font:700 34px/1 var(--fm);letter-spacing:-.03em}
.tile .k{font:600 9.5px var(--fm);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.tile.hero{grid-column:1/-1;background:linear-gradient(135deg,var(--g1),var(--g2) 75%);border-color:rgba(61,245,143,.28);padding:18px}
.tile.hero .n{font-size:52px}
.tile.hero .k{color:rgba(238,243,240,.75)}
.tile .sub{font:500 10.5px var(--fm);color:var(--acc);margin-top:6px;letter-spacing:.06em}
.bars{border:1px solid var(--line);background:var(--s1);padding:6px 12px}
.bars .b{display:grid;grid-template-columns:22px 90px 1fr 26px;gap:10px;align-items:center;height:36px}
.bars img{width:20px;height:20px;object-fit:contain}
.bars .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .track{height:5px;background:var(--s3);position:relative}
.bars .track i{position:absolute;left:0;top:0;bottom:0;background:var(--acc)}
.bars .c{font:700 12px var(--fm);text-align:right}
.teams-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tpick{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px 8px;border:1px solid var(--line);background:var(--s1);font:600 9px var(--fm);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-radius:2px;min-width:0}
.tpick span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
.tpick img{width:30px;height:30px;object-fit:contain;filter:grayscale(1) brightness(.75)}
.tpick.on{border-color:var(--acc);color:var(--text);background:var(--accbg);box-shadow:inset 0 0 0 1px var(--acc)}
.tpick.on img{filter:none}
.recent{border:1px solid var(--line);background:var(--s1)}
.recent .it{display:flex;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
.recent .it:last-child{border-bottom:0}
.recent .it .m{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.recent .it .d{font:500 10px var(--fm);color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.tag{font:700 9px var(--fm);letter-spacing:.1em;padding:3px 5px;border:1px solid var(--acc);color:var(--acc);flex:none}
.tag.f{background:var(--acc);color:var(--ink)}
.note{color:var(--muted);font-size:13px;margin:0}
.panel{border:1px solid var(--line);background:var(--s1);padding:16px}
.field{margin-bottom:16px}
.field label{display:block;font:600 9.5px var(--fm);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.field input,.field select{width:100%;font:16px var(--fb);color:var(--text);background:var(--bg);border:1px solid var(--line2);border-radius:2px;padding:10px 12px;-webkit-appearance:none;appearance:none}
.field input:focus,.field select:focus{outline:none;border-color:var(--acc)}
.field p{font-size:12px;color:var(--muted);margin:6px 0 0}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;font-weight:600;font-size:14px}
.toggle input{width:22px;height:22px;accent-color:#3df58f;flex:none}
.btn{display:block;width:100%;padding:13px;border-radius:2px;font:700 16px var(--fc);letter-spacing:.08em;text-transform:uppercase;background:var(--s3);border:1px solid var(--line2)}
.btn.primary{background:var(--acc);color:var(--ink);border-color:var(--acc);display:inline-block;width:auto;padding:12px 26px}
.panel .btn.primary{display:block;width:100%}
.link-btn{display:block;margin:14px auto 0;font:600 10px var(--fm);letter-spacing:.14em;text-transform:uppercase;color:#ff8a95}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:grid;grid-template-columns:repeat(3,1fr);padding:7px 10px calc(env(safe-area-inset-bottom) + 6px);background:rgba(4,6,5,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.tb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 0;font:600 9.5px var(--fm);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);position:relative}
.tb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb.on{color:var(--text)}
.tb.on::before{content:"";position:absolute;top:-8px;width:28px;height:2px;background:var(--acc);box-shadow:0 0 10px var(--acc)}
</style>
</head>
<body>
<header class="head">
  <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a6b43"/><stop offset="1" stop-color="#03110a"/></linearGradient></defs>
    <rect width="64" height="64" rx="14" fill="url(#lg)"/>
    <rect x="10" y="10" width="44" height="44" rx="2" fill="none" stroke="#fff" stroke-width="2.2"/>
    <path d="M32 10v12.5M32 41.5V54" stroke="#fff" stroke-width="2.2"/>
    <circle cx="32" cy="32" r="9.5" fill="none" stroke="#fff" stroke-width="2.2"/>
    <path d="M29.3 27.6v8.8l7.2-4.4z" fill="#fff"/>
  </svg>
  <div class="brand"><small>Premier League · Highlights</small><b id="title">Matches</b></div>
  <button class="icon-btn" id="refreshBtn" aria-label="Refresh"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
</header>

<main>
  <!-- MATCHES -->
  <section id="tab-matches">
    <div class="weekbar">
      <button class="icon-btn" data-act="prev" aria-label="Previous week"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="wk"><div class="r" id="range"></div><button id="todayBtn" data-act="today" hidden>Back to this week</button></div>
      <button class="icon-btn" data-act="next" aria-label="Next week"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <div class="prog"><span id="progText">–</span><div class="bar"><i id="progBar" style="width:0"></i></div></div>
    <div class="chips">
      <button class="chip on" data-act="filter" data-f="all">All</button>
      <button class="chip" data-act="filter" data-f="unwatched">Unseen</button>
      <button class="chip" data-act="filter" data-f="ready">Ready</button>
    </div>
    <div id="banner"></div>
    <div id="list"><div class="empty-state">Loading matches…</div></div>
  </section>

  <!-- TABLE -->
  <section id="tab-table" hidden>
    <div id="tableBody"><div class="empty-state">Loading table…</div></div>
  </section>

  <!-- ME -->
  <section id="tab-me" hidden>
    <div id="meStats"></div>
    <div class="lbl">Favorite teams</div>
    <p class="note" style="margin-bottom:10px">Their matches are pinned to the top and highlighted.</p>
    <div class="teams-grid" id="favGrid"></div>

    <div class="lbl" id="settings">Settings</div>
    <div class="panel">
      <div class="field">
        <label for="apiKey">YouTube Data API key</label>
        <input type="password" id="apiKey" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="AIza…">
        <p>Stored only on this device.</p>
      </div>
      <div class="field">
        <label for="handle">YouTube channel</label>
        <input type="text" id="handle" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
      <label class="toggle">Spoiler shield — hide scores and table until watched<input type="checkbox" id="hideScores"></label>
      <div class="field">
        <label for="refreshMin">Auto-refresh</label>
        <select id="refreshMin">
          <option value="2">Every 2 minutes</option><option value="5">Every 5 minutes</option>
          <option value="10">Every 10 minutes</option><option value="15">Every 15 minutes</option><option value="30">Every 30 minutes</option>
        </select>
        <p>Every minute while a match is live.</p>
      </div>
      <button class="btn primary" data-act="saveSettings">Save settings</button>
      <button class="link-btn" data-act="resetCache">Clear saved video list</button>
    </div>
  </section>

  <div class="status" id="status"></div>
</main>

<nav class="tabbar">
  <button class="tb" data-act="tab" data-t="matches"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M10 9.5v5l4.5-2.5z"/></svg>Matches</button>
  <button class="tb" data-act="tab" data-t="table"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16M8 3v18"/></svg>Table</button>
  <button class="tb" data-act="tab" data-t="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Me</button>
</nav>

<script>
const ESPN = 'https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard';
const STAND = 'https://site.api.espn.com/apis/v2/sports/soccer/eng.1/standings';
const YT = 'https://www.googleapis.com/youtube/v3';
const $ = s => document.querySelector(s);
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const settings = Object.assign({ apiKey:'', handle:'@NBCSports', hideScores:true, refreshMin:5 }, LS.get('plh.settings', {}));
let watched = LS.get('plh.watched', {});
for (const [k, v] of Object.entries(watched)) if (typeof v === 'number') watched[k] = { h: v }; // migrate v1
let favs = LS.get('plh.favs', []);
let standings = LS.get('plh.standings', null);
let vcache = LS.get('plh.videos', null) || { uploads:null, handle:null, videos:{}, newest:null, oldest:null };
const saveV = () => LS.set('plh.videos', vcache);
let tab = LS.get('plh.tab', 'matches');
let revealed = {}, tableRevealed = false, tableErr = '';
let weekOffset = 0, games = [], filter = 'all', loading = false;
let lastYT = 0, lastRefresh = 0, timer = null;

const seen = id => !!(watched[id] && (watched[id].h || watched[id].f));
const isFav = g => favs.includes(g.home.name) || favs.includes(g.away.name);

/* ---------- Week window (Tue → Mon) ---------- */
function windowFor(offset){
  const n = new Date();
  const d = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  const back = (d.getDay() - 2 + 7) % 7;
  const start = new Date(d); start.setDate(d.getDate() - back + offset * 7);
  const end = new Date(start); end.setDate(start.getDate() + 6);
  return { start, end };
}
const ymd = d => `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
function fmtRange({start, end}){
  const o = { month:'short', day:'numeric' };
  return `${start.toLocaleDateString([], o)} – ${end.toLocaleDateString([], start.getMonth() === end.getMonth() ? { day:'numeric' } : o)}`;
}

/* ---------- Scores (ESPN, one request per day) ---------- */
async function fetchGames(win){
  const days = [];
  for (let i = -1; i <= 7; i++) { const d = new Date(win.start); d.setDate(d.getDate() + i); days.push(ymd(d)); }
  const results = await Promise.allSettled(days.map(async day => {
    const r = await fetch(`${ESPN}?dates=${day}`, { cache:'no-store' });
    if (!r.ok) throw new Error('Could not load scores (' + r.status + ')');
    return (await r.json()).events || [];
  }));
  const ok = results.filter(x => x.status === 'fulfilled');
  if (!ok.length) throw results[0].reason;
  const ids = new Set(), events = [];
  ok.forEach(x => x.value.forEach(ev => { if (!ids.has(ev.id)) { ids.add(ev.id); events.push(ev); } }));
  const lo = win.start.getTime(), hi = win.end.getTime() + 86400000;
  return events.map(ev => {
    const c = (ev.competitions || [])[0] || {};
    const side = h => {
      const t = (c.competitors || []).find(x => x.homeAway === h) || {};
      const tm = t.team || {};
      return { name: tm.displayName || '?', short: tm.shortDisplayName || tm.displayName || '?',
               location: tm.location || '', logo: tm.logo || '', score: t.score ?? '' };
    };
    const st = (ev.status && ev.status.type) || (c.status && c.status.type) || {};
    return { id: ev.id, date: new Date(ev.date), home: side('home'), away: side('away'),
             state: st.state, detail: st.shortDetail || st.detail || '', completed: !!st.completed };
  }).filter(g => g.date.getTime() >= lo && g.date.getTime() < hi).sort((x, y) => x.date - y.date);
}

/* ---------- Table (ESPN standings) ---------- */
async function fetchStandings(){
  const r = await fetch(STAND, { cache:'no-store' });
  if (!r.ok) throw new Error('Could not load table (' + r.status + ')');
  const j = await r.json();
  const entries = (j.children && j.children[0] && j.children[0].standings && j.children[0].standings.entries)
               || (j.standings && j.standings.entries) || [];
  const rows = entries.map(e => {
    const s = {}; (e.stats || []).forEach(x => s[x.name] = x);
    const v = n => s[n] ? (s[n].displayValue ?? s[n].value) : '';
    const tm = e.team || {};
    return { name: tm.displayName || '?', short: tm.shortDisplayName || tm.displayName || '?',
             logo: (tm.logos && tm.logos[0] && tm.logos[0].href) || '', rank: Number(s.rank ? s.rank.value : 0),
             gp: v('gamesPlayed'), w: v('wins'), d: v('ties'), l: v('losses'), gd: v('pointDifferential'), pts: v('points'),
             note: e.note || null };
  }).sort((a, b) => (a.rank || 99) - (b.rank || 99));
  if (rows.length) { standings = { rows, at: Date.now() }; LS.set('plh.standings', standings); }
}

/* ---------- YouTube (NBC Sports uploads — 1 quota unit per 50 videos) ---------- */
async function yt(path, params){
  const u = new URL(YT + path);
  Object.entries({ ...params, key: settings.apiKey }).forEach(([k, v]) => u.searchParams.set(k, v));
  const r = await fetch(u);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error('YouTube: ' + ((j.error && j.error.message) || r.status));
  return j;
}
async function uploadsId(){
  if (vcache.uploads && vcache.handle === settings.handle) return vcache.uploads;
  const j = await yt('/channels', { part:'contentDetails', forHandle: settings.handle });
  const id = j.items && j.items[0] && j.items[0].contentDetails.relatedPlaylists.uploads;
  if (!id) throw new Error('Could not find YouTube channel ' + settings.handle);
  vcache = { uploads:id, handle:settings.handle, videos:{}, newest:null, oldest:null };
  saveV();
  return id;
}
const looksLikeHighlight = t => /highlights/i.test(t) && /\sv(s)?\.?\s/i.test(t);
async function scanVideos(win){
  const pl = await uploadsId();
  const floor = new Date(win.start.getTime() - 86400000);
  const covered = vcache.oldest && new Date(vcache.oldest) <= floor;
  const stopAt = covered && vcache.newest ? new Date(vcache.newest) : floor;
  let token = '', pages = 0, newest = null, oldest = null;
  while (pages < 40) {
    const j = await yt('/playlistItems', { part:'snippet', playlistId: pl, maxResults: 50, ...(token ? { pageToken: token } : {}) });
    pages++;
    let done = false;
    for (const it of j.items || []) {
      const s = it.snippet || {}, id = s.resourceId && s.resourceId.videoId;
      if (!id || !s.publishedAt) continue;
      const t = new Date(s.publishedAt);
      if (!newest || t > newest) newest = t;
      if (!oldest || t < oldest) oldest = t;
      if (looksLikeHighlight(s.title || '')) {
        const th = s.thumbnails || {};
        vcache.videos[id] = { id, title: s.title, pub: s.publishedAt, thumb: (th.medium || th.high || th.default || {}).url || '' };
      }
      if (t < stopAt) done = true;
    }
    token = j.nextPageToken;
    if (done || !token) break;
  }
  if (newest && (!vcache.newest || newest > new Date(vcache.newest))) vcache.newest = newest.toISOString();
  if (oldest && (!vcache.oldest || oldest < new Date(vcache.oldest))) vcache.oldest = oldest.toISOString();
  const cutoff = Date.now() - 150 * 86400000;
  for (const [id, v] of Object.entries(vcache.videos)) if (new Date(v.pub).getTime() < cutoff) delete vcache.videos[id];
  saveV();
}

/* ---------- Match videos to games by team names ---------- */
const norm = s => ' ' + String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/&/g, ' and ').replace(/[^a-z0-9']+/g, ' ').trim() + ' ';
const ALIAS_RAW = {
  'Manchester United':['Man United','Man Utd','Manchester Utd'], 'Manchester City':['Man City'],
  'Tottenham Hotspur':['Tottenham','Spurs'], 'Wolverhampton Wanderers':['Wolves','Wolverhampton'],
  'Brighton & Hove Albion':['Brighton'], 'AFC Bournemouth':['Bournemouth'], 'Nottingham Forest':["Nott'm Forest",'Forest'],
  'West Ham United':['West Ham'], 'Newcastle United':['Newcastle'], 'Leeds United':['Leeds'],
  'Sheffield United':['Sheffield Utd','Sheff Utd'], 'Sheffield Wednesday':['Sheff Wed'], 'Leicester City':['Leicester'],
  'Ipswich Town':['Ipswich'], 'Crystal Palace':['Palace'], 'Aston Villa':['Villa'], 'West Bromwich Albion':['West Brom'],
  'Queens Park Rangers':['QPR'], 'Norwich City':['Norwich'], 'Coventry City':['Coventry'], 'Hull City':['Hull'],
  'Stoke City':['Stoke'], 'Cardiff City':['Cardiff'], 'Swansea City':['Swansea'], 'Middlesbrough':['Boro']
};
const ALIAS = {};
for (const [k, v] of Object.entries(ALIAS_RAW)) ALIAS[norm(k).trim()] = v.map(a => norm(a).trim());
const SKIP_FIRST = new Set(['manchester','west','sheffield','aston','crystal','nottingham','queens','afc','fc']);
const aliasMemo = {};
function aliases(t){
  if (aliasMemo[t.name]) return aliasMemo[t.name];
  const key = norm(t.name).trim();
  const set = new Set([key, norm(t.short).trim(), norm(t.location).trim(), key.replace(/^(afc|fc) | (afc|fc)$/g, '')]);
  (ALIAS[key] || []).forEach(a => set.add(a));
  const first = key.split(' ')[0];
  if (first.length >= 4 && !SKIP_FIRST.has(first)) set.add(first);
  return aliasMemo[t.name] = [...set].filter(a => a.length >= 3);
}
function findVideos(g){
  const ha = aliases(g.home), aa = aliases(g.away);
  const lo = g.date.getTime() - 3 * 3600e3, hi = g.date.getTime() + 6 * 86400e3;
  let ext = null, short = null;
  for (const v of Object.values(vcache.videos)) {
    const t = new Date(v.pub).getTime();
    if (t < lo || t > hi) continue;
    const n = norm(v.title);
    if (!ha.some(a => n.includes(' ' + a + ' ')) || !aa.some(a => n.includes(' ' + a + ' '))) continue;
    if (/extended/i.test(v.title)) { if (!ext || t < new Date(ext.pub).getTime()) ext = v; }
    else if (!/condensed|reaction|preview|analysis/i.test(v.title)) { if (!short) short = v; }
  }
  return { ext, short };
}

/* ---------- Teams helpers ---------- */
function teamList(){
  const map = {};
  (standings ? standings.rows : []).forEach(r => map[r.name] = { name: r.name, short: r.short, logo: r.logo });
  games.forEach(g => [g.home, g.away].forEach(t => { if (!map[t.name]) map[t.name] = { name: t.name, short: t.short, logo: t.logo }; }));
  return Object.values(map);
}
const teamInfo = name => teamList().find(t => t.name === name) || { name, short: name, logo: '' };

/* ---------- Render: matches ---------- */
function renderMatches(){
  const win = windowFor(weekOffset);
  $('#range').textContent = fmtRange(win);
  $('#todayBtn').hidden = weekOffset === 0;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.f === filter));
  $('#banner').innerHTML = settings.apiKey ? '' :
    `<div class="banner">Add a YouTube API key to pull in the NBC Sports videos. <button data-act="goSettings">Open settings</button></div>`;

  const rows = games.map(g => ({ g, v: findVideos(g) }));
  const n = games.filter(g => seen(g.id)).length;
  $('#progText').innerHTML = games.length ? `<b>${n}</b> / ${games.length} seen` : 'No matches';
  $('#progBar').style.width = games.length ? (n / games.length * 100) + '%' : '0';

  const shown = rows.filter(({ g, v }) =>
    filter === 'all' ? true : filter === 'unwatched' ? !seen(g.id) : (v.ext && !seen(g.id)));

  if (!games.length) { $('#list').innerHTML = `<div class="empty-state">${loading ? 'Loading matches…' : 'No Premier League matches this week'}</div>`; return; }
  if (!shown.length) { $('#list').innerHTML = `<div class="empty-state">${filter === 'ready' ? 'Nothing new to watch yet' : 'All caught up'}</div>`; return; }

  let html = '';
  const favRows = shown.filter(r => isFav(r.g)), rest = shown.filter(r => !isFav(r.g));
  if (favRows.length) { html += `<div class="lbl fav">Your teams</div>` + favRows.map(card).join(''); }
  let lastDay = '';
  for (const r of rest) {
    const day = r.g.date.toLocaleDateString([], { weekday:'long', month:'short', day:'numeric' });
    if (day !== lastDay) { html += `<div class="lbl">${esc(day)}</div>`; lastDay = day; }
    html += card(r);
  }
  $('#list').innerHTML = html;
}

function card({ g, v }){
  const e = watched[g.id] || {};
  const s = !!(e.h || e.f);
  const started = g.state !== 'pre';
  const showScore = started && (!settings.hideScores || s || revealed[g.id]);
  const hidden = started && !showScore;
  const hs = Number(g.home.score), as = Number(g.away.score);
  const winner = showScore && g.completed ? (hs > as ? 'h' : as > hs ? 'a' : '') : '';
  const team = (t, side) => `<div class="team ${winner && winner !== side ? 'lose' : ''} ${favs.includes(t.name) ? 'fav' : ''}">
      ${t.logo ? `<img src="${esc(t.logo)}" alt="" loading="lazy">` : '<span class="nologo"></span>'}
      <span class="tn">${esc(t.short)}</span>
      <span class="sc">${!started ? '' : showScore ? esc(t.score) : '<span class="q"></span>'}</span></div>`;
  const time = g.date.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
  const fav = isFav(g);

  let status;
  if (!started) status = `${fav ? g.date.toLocaleDateString([], { weekday:'short' }) + ' · ' : ''}Kickoff ${esc(time)}`;
  else if (g.state === 'in') status = `<span class="live">Live</span> ${esc(g.detail)}`;
  else status = `${esc(g.detail || 'FT')}${fav ? ' · ' + g.date.toLocaleDateString([], { weekday:'short' }) : ''}`;
  if (hidden) status += ' · Tap teams to reveal';

  let thumb;
  if (v.ext) thumb = `<a class="thumb" href="https://www.youtube.com/watch?v=${esc(v.ext.id)}" target="_blank" rel="noopener">
      ${v.ext.thumb ? `<img src="${esc(v.ext.thumb)}" alt="" loading="lazy">` : ''}<span class="play"></span><span class="badge">EXTENDED</span></a>`;
  else if (g.completed) thumb = `<div class="thumb empty">${settings.apiKey ? 'Awaiting video' : 'Add API key'}</div>`;
  else if (g.state === 'in') thumb = `<div class="thumb empty">In play</div>`;
  else thumb = `<div class="thumb empty">${esc(time)}</div>`;

  const shortLink = !v.ext && v.short
    ? ` · <a href="https://www.youtube.com/watch?v=${esc(v.short.id)}" target="_blank" rel="noopener">Short highlights</a>` : '';
  const dis = started ? '' : 'disabled';

  return `<article class="card ${s ? 'seen' : ''} ${fav ? 'fav' : ''}">
    <div class="row">
      <div class="teams" ${hidden ? `data-act="reveal" data-id="${esc(g.id)}"` : ''}>${team(g.home, 'h')}${team(g.away, 'a')}</div>
      ${thumb}
    </div>
    <div class="meta">${status}${shortLink}</div>
    <div class="acts">
      <button class="act ${e.h ? 'on' : ''}" data-act="mark" data-kind="h" data-id="${esc(g.id)}" ${dis}><span class="box"></span>Highlights</button>
      <button class="act ${e.f ? 'on' : ''}" data-act="mark" data-kind="f" data-id="${esc(g.id)}" ${dis}><span class="box"></span>Live / Full</button>
    </div>
  </article>`;
}

/* ---------- Render: me ---------- */
function renderMe(){
  const list = Object.entries(watched).map(([id, e]) => ({ id, ...e }));
  const now = new Date();
  const seasonStart = new Date(now.getMonth() >= 6 ? now.getFullYear() : now.getFullYear() - 1, 6, 1);
  const seenAll = list.filter(e => e.h || e.f);
  const seenSeason = seenAll.filter(e => !e.date || new Date(e.date) >= seasonStart).length;
  const hl = list.filter(e => e.h).length, full = list.filter(e => e.f).length, both = list.filter(e => e.h && e.f).length;
  const favSeen = favs.length ? seenAll.filter(e => favs.includes(e.home) || favs.includes(e.away)).length : null;

  let html = `<div class="tiles">
    <div class="tile hero"><div class="n">${seenAll.length}</div><div class="k">Matches seen</div>
      <div class="sub">${Math.round(seenSeason / 380 * 100)}% of the 380-match season</div></div>
    <div class="tile"><div class="n">${hl}</div><div class="k">Highlights</div></div>
    <div class="tile"><div class="n">${full}</div><div class="k">Live / Full</div></div>
    <div class="tile"><div class="n">${favSeen == null ? '–' : favSeen}</div><div class="k">${favSeen == null ? 'Pick a team below' : 'Your teams’ games'}</div></div>

  if (top.length) {

      const t = teamInfo(name);
      return `<div class="b">${t.logo ? `<img src="${esc(t.logo)}" alt="">` : '<span></span>'}<span class="nm">${esc(t.short)}</span><span class="track"><i style="width:${c / max * 100}%"></i></span><span class="c">${c}</span></div>`;
    }).join('') + `</div>`;
  }

  const recent = seenAll.filter(e => e.home).sort((a, b) => Math.max(b.h || 0, b.f || 0) - Math.max(a.h || 0, a.f || 0)).slice(0, 6);
  if (recent.length) {
    html += `<div class="lbl">Recently watched</div><div class="recent">` + recent.map(e => `<div class="it">
      ${e.f ? '<span class="tag f">FULL</span>' : ''}${e.h ? '<span class="tag">HL</span>' : ''}
      <span class="m">${esc(teamInfo(e.home).short)} v ${esc(teamInfo(e.away).short)}</span>
      <span class="d">${e.date ? new Date(e.date).toLocaleDateString([], { month:'short', day:'numeric' }) : ''}</span></div>`).join('') + `</div>`;
  }

      ${t.logo ? `<img src="${esc(t.logo)}" alt="" loading="lazy">` : ''}<span>${esc(t.short)}</span></button>`).join('')
    : `<p class="note">Teams load with the table.</p>`;
}

function setStatus(msg, err){ const s = $('#status'); s.textContent = msg; s.classList.toggle('err', !!err); }

/* ---------- Refresh loop ---------- */
async function refresh(force){
  if (loading) return;
  loading = true; $('#refreshBtn').classList.add('spin');
  const win = windowFor(weekOffset), myOffset = weekOffset;
  let errMsg = '';
  try {
    const [gr, sr] = await Promise.allSettled([fetchGames(win), fetchStandings()]);
    if (sr.status === 'rejected') tableErr = sr.reason.message;
    if (myOffset !== weekOffset) return;
    if (gr.status === 'fulfilled') games = gr.value; else errMsg = gr.reason.message;
    renderAll();
    if (settings.apiKey && gr.status === 'fulfilled') {
      const need = games.some(x => x.completed && !findVideos(x).ext);
      const covered = vcache.oldest && new Date(vcache.oldest) <= new Date(win.start.getTime() - 86400000);
      if (need && (force || !covered || Date.now() - lastYT > 120000)) {
        lastYT = Date.now();
        try { await scanVideos(win); } catch (e) { errMsg = e.message; }
      }
    }
    const t = new Date().toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
    errMsg ? setStatus(errMsg, true) : setStatus('Updated ' + t);
  } catch (e) {
    setStatus(e.message || 'Something went wrong', true);
  } finally {
    loading = false; $('#refreshBtn').classList.remove('spin');
    lastRefresh = Date.now(); renderAll(); schedule();
  }
}
function schedule(){
  clearTimeout(timer);
  const mins = games.some(g => g.state === 'in') ? 1 : Number(settings.refreshMin) || 5;
  timer = setTimeout(() => document.visibilityState === 'visible' ? refresh() : schedule(), mins * 60000);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Date.now() - lastRefresh > 60000) refresh();
});

/* ---------- Interactions ---------- */
function fillSettings(){
  $('#apiKey').value = settings.apiKey; $('#handle').value = settings.handle;
  $('#hideScores').checked = settings.hideScores; $('#refreshMin').value = String(settings.refreshMin);
}
function goWeek(o){ weekOffset = o; games = []; revealed = {}; renderAll(); refresh(); }
function setTab(t){ tab = t; LS.set('plh.tab', t); renderAll(); window.scrollTo(0, 0); }

$('#refreshBtn').addEventListener('click', () => refresh(true));
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === 'mark') {
    const g = games.find(x => x.id === id); if (!g) return;
    const k = el.dataset.kind, entry = watched[id] || {};
    entry[k] ? delete entry[k] : (entry[k] = Date.now());
    Object.assign(entry, { home: g.home.name, away: g.away.name, date: g.date.toISOString() });
    if (!entry.h && !entry.f) delete watched[id]; else watched[id] = entry;
    LS.set('plh.watched', watched); renderMatches();
  }
  else if (act === 'reveal') { revealed[id] = true; renderMatches(); }
  else if (act === 'filter') { filter = el.dataset.f; renderMatches(); }
  else if (act === 'prev') goWeek(weekOffset - 1);
  else if (act === 'next') goWeek(weekOffset + 1);
  else if (act === 'today') goWeek(0);
  else if (act === 'tab') setTab(el.dataset.t);
  else if (act === 'showTable') { tableRevealed = true; renderTable(); }
  else if (act === 'fav') {
    const n = el.dataset.name;
    favs = favs.includes(n) ? favs.filter(x => x !== n) : [...favs, n];
    LS.set('plh.favs', favs); renderMe();
  }
  else if (act === 'goSettings') { setTab('me'); fillSettings(); setTimeout(() => $('#settings').scrollIntoView({ behavior:'smooth' }), 50); }
  else if (act === 'saveSettings') {
    settings.apiKey = $('#apiKey').value.trim();
    settings.handle = $('#handle').value.trim() || '@NBCSports';
    if (!settings.handle.startsWith('@')) settings.handle = '@' + settings.handle;
    settings.hideScores = $('#hideScores').checked;
    settings.refreshMin = Number($('#refreshMin').value);
    LS.set('plh.settings', settings);
    setStatus('Settings saved'); refresh(true);
  }
  else if (act === 'resetCache') {
    vcache = { uploads:null, handle:null, videos:{}, newest:null, oldest:null }; saveV();
    setStatus('Video list cleared'); refresh(true);
  }
});

fillSettings();
renderAll();
refresh();
</script>
</body>
</html>
