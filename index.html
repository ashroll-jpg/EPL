<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Highlights">
<meta name="theme-color" content="#0b0d12">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>PL Highlights</title>
<style>
:root{--bg:#0b0d12;--card:#151922;--card2:#1d2331;--line:#252c3b;--text:#eef1f7;--muted:#8a92a6;--accent:#3ddc84;--live:#ff4d4f;--yt:#ff3b30}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(env(safe-area-inset-bottom) + 28px);overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:5;background:rgba(11,13,18,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:calc(env(safe-area-inset-top) + 10px) 16px 12px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}
.top h1{font-size:22px;margin:0;font-weight:750;letter-spacing:-.02em;flex:1}
.top h1 small{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;text-transform:uppercase}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center;border:1px solid var(--line)}
.icon-btn svg{width:19px;height:19px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.week{display:flex;align-items:center;gap:8px;margin-top:12px}
.week .icon-btn{width:34px;height:34px}
.range{flex:1;text-align:center;font-weight:650}
.range button{display:block;margin:2px auto 0;font-size:12px;color:var(--accent);font-weight:600}
.progress{margin-top:12px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:3px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.chips{display:flex;gap:6px;margin-top:10px}
.chip{padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
main{padding:4px 16px 0;max-width:640px;margin:0 auto}
.banner{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:#2a2412;border:1px solid #4a3d16;color:#f3d98a;font-size:14px}
.banner button{color:#fff;font-weight:700;text-decoration:underline}
.day{margin:20px 2px 8px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;transition:opacity .2s}
.card.done{opacity:.55}
.row{display:grid;grid-template-columns:1fr 112px;gap:12px;align-items:center}
.teams{min-width:0}
.team{display:flex;align-items:center;gap:9px;height:30px}
.team img,.nologo{width:22px;height:22px;object-fit:contain;flex:none}
.nologo{border-radius:50%;background:var(--card2)}
.tn{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc{font-weight:750;font-size:17px;font-variant-numeric:tabular-nums;min-width:18px;text-align:right}
.team.lose .tn,.team.lose .sc{color:var(--muted);font-weight:500}
.q{display:inline-block;width:18px;height:18px;border-radius:5px;background:var(--card2);vertical-align:middle}
.hint{font-size:12px;color:var(--muted);margin-top:2px}
.thumb{position:relative;display:block;width:112px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--card2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .play{position:absolute;inset:0;margin:auto;width:34px;height:24px;border-radius:7px;background:var(--yt);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.thumb .play::after{content:"";position:absolute;left:13px;top:6px;border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}
.thumb .badge{position:absolute;left:5px;bottom:5px;font-size:10px;font-weight:700;background:rgba(0,0,0,.72);padding:2px 5px;border-radius:4px;letter-spacing:.02em}
.thumb.empty{display:grid;place-items:center;text-align:center;font-size:11.5px;color:var(--muted);padding:6px;border:1px dashed var(--line);background:transparent}
.foot{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.foot .st{flex:1;min-width:0}
.live{color:var(--live);font-weight:800;letter-spacing:.04em}
.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-right:5px;vertical-align:1px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
.short{color:var(--text);text-decoration:underline;text-underline-offset:2px}
.watch{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;border:1px solid var(--line);font-weight:650;font-size:13px;color:var(--text)}
.watch .ck{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center}
.watch.on{background:rgba(61,220,132,.14);border-color:rgba(61,220,132,.5);color:var(--accent)}
.watch.on .ck{border-color:var(--accent);background:var(--accent)}
.watch.on .ck::after{content:"";width:4px;height:8px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.empty-state{text-align:center;color:var(--muted);padding:48px 16px}
.status{text-align:center;font-size:12px;color:var(--muted);margin:18px 0 0}
.status.err{color:#ff8a80}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:90vh;overflow:auto}
.sheet h2{margin:0 0 14px;font-size:19px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:650;color:var(--muted);margin-bottom:6px}
.field input[type=text],.field input[type=password],.field select{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.field p{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;font-weight:600}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.actions{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;padding:12px;border-radius:12px;font-weight:700;background:var(--card2);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:#06210f;border-color:var(--accent)}
.link-btn{font-size:13px;color:#ff8a80;font-weight:600;margin-top:4px}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1><small>Premier League</small>Extended Highlights</h1>
    <button class="icon-btn" id="refreshBtn" aria-label="Refresh"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
    <button class="icon-btn" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <div class="week">
    <button class="icon-btn" data-act="prev" aria-label="Previous week"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="range"><span id="range"></span><button id="todayBtn" data-act="today" hidden>Back to this week</button></div>
    <button class="icon-btn" data-act="next" aria-label="Next week"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
  <div class="progress"><span id="progText">–</span><div class="bar"><i id="progBar" style="width:0"></div></div></div>
  <div class="chips">
    <button class="chip on" data-act="filter" data-f="all">All</button>
    <button class="chip" data-act="filter" data-f="unwatched">Unwatched</button>
    <button class="chip" data-act="filter" data-f="ready">Ready to watch</button>
  </div>
</header>

<main>
  <div id="banner"></div>
  <div id="list"><div class="empty-state">Loading matches…</div></div>
  <div class="status" id="status"></div>
</main>

<div class="sheet-bg" id="sheet">
  <div class="sheet">
    <h2>Settings</h2>
    <div class="field">
      <label for="apiKey">YouTube Data API key</label>
      <input type="password" id="apiKey" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="AIza…">
      <p>Stored only on this device. Needed to find the NBC Sports videos — scores work without it.</p>
    </div>
    <div class="field">
      <label for="handle">YouTube channel</label>
      <input type="text" id="handle" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <label class="toggle">Hide scores until watched (tap a match to peek)<input type="checkbox" id="hideScores"></label>
    <div class="field">
      <label for="refreshMin">Auto-refresh every</label>
      <select id="refreshMin">
        <option value="2">2 minutes</option><option value="5">5 minutes</option>
        <option value="10">10 minutes</option><option value="15">15 minutes</option><option value="30">30 minutes</option>
      </select>
      <p>Checks every minute while a match is live. YouTube is only searched while a finished match is still missing its video.</p>
    </div>
    <div class="actions">
      <button class="btn" data-act="closeSettings">Cancel</button>
      <button class="btn primary" data-act="saveSettings">Save</button>
    </div>
    <p style="text-align:center"><button class="link-btn" data-act="resetCache">Clear saved video list</button></p>
  </div>
</div>

<script>
const ESPN = 'https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard';
const YT = 'https://www.googleapis.com/youtube/v3';
const $ = s => document.querySelector(s);
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const settings = Object.assign({ apiKey:'', handle:'@NBCSports', hideScores:true, refreshMin:5 }, LS.get('plh.settings', {}));
let watched = LS.get('plh.watched', {});
let vcache = LS.get('plh.videos', null) || { uploads:null, handle:null, videos:{}, newest:null, oldest:null };
const saveV = () => LS.set('plh.videos', vcache);
let revealed = {};
let weekOffset = 0, games = [], filter = 'all', loading = false;
let lastYT = 0, lastRefresh = 0, timer = null;

/* ---------- Week window (Tue → Mon, covers a weekend round + midweek) ---------- */
function windowFor(offset){
  const n = new Date();
  const d = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  const back = (d.getDay() - 2 + 7) % 7;
  const start = new Date(d); start.setDate(d.getDate() - back + offset * 7);
  const end = new Date(start); end.setDate(start.getDate() + 6);
  return { start, end };
}
const ymd = d => `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
function fmtRange({start, end}){
  const o = { month:'short', day:'numeric' };
  return `${start.toLocaleDateString([], o)} – ${end.toLocaleDateString([], start.getMonth() === end.getMonth() ? { day:'numeric' } : o)}`;
}

/* ---------- Scores (ESPN public scoreboard) ---------- */
async function fetchGames(win){
  // ESPN rejects date ranges, so ask for each day separately (in parallel)
  const days = [];
  for (let i = -1; i <= 7; i++) { const d = new Date(win.start); d.setDate(d.getDate() + i); days.push(ymd(d)); }
  const results = await Promise.allSettled(days.map(async day => {
    const r = await fetch(`${ESPN}?dates=${day}`, { cache:'no-store' });
    if (!r.ok) throw new Error('Could not load scores (' + r.status + ')');
    return (await r.json()).events || [];
  }));
  const ok = results.filter(x => x.status === 'fulfilled');
  if (!ok.length) throw results[0].reason;
  const seen = new Set(), events = [];
  ok.forEach(x => x.value.forEach(ev => { if (!seen.has(ev.id)) { seen.add(ev.id); events.push(ev); } }));
  const lo = win.start.getTime(), hi = win.end.getTime() + 86400000;
  return events.map(ev => {
    const c = (ev.competitions || [])[0] || {};
    const side = h => {
      const t = (c.competitors || []).find(x => x.homeAway === h) || {};
      const tm = t.team || {};
      return { name: tm.displayName || '?', short: tm.shortDisplayName || tm.displayName || '?',
               location: tm.location || '', logo: tm.logo || '', score: t.score ?? '' };
    };
    const st = (ev.status && ev.status.type) || (c.status && c.status.type) || {};
    return { id: ev.id, date: new Date(ev.date), home: side('home'), away: side('away'),
             state: st.state, detail: st.shortDetail || st.detail || '', completed: !!st.completed };
  }).filter(g => g.date.getTime() >= lo && g.date.getTime() < hi).sort((x, y) => x.date - y.date);
}

/* ---------- YouTube (NBC Sports uploads playlist — 1 quota unit per 50 videos) ---------- */
async function yt(path, params){
  const u = new URL(YT + path);
  Object.entries({ ...params, key: settings.apiKey }).forEach(([k, v]) => u.searchParams.set(k, v));
  const r = await fetch(u);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error('YouTube: ' + ((j.error && j.error.message) || r.status));
  return j;
}
async function uploadsId(){
  if (vcache.uploads && vcache.handle === settings.handle) return vcache.uploads;
  const j = await yt('/channels', { part:'contentDetails', forHandle: settings.handle });
  const id = j.items && j.items[0] && j.items[0].contentDetails.relatedPlaylists.uploads;
  if (!id) throw new Error('Could not find YouTube channel ' + settings.handle);
  vcache = { uploads:id, handle:settings.handle, videos:{}, newest:null, oldest:null };
  saveV();
  return id;
}
const looksLikeHighlight = t => /highlights/i.test(t) && /\sv(s)?\.?\s/i.test(t);

async function scanVideos(win){
  const pl = await uploadsId();
  const floor = new Date(win.start.getTime() - 86400000);
  const covered = vcache.oldest && new Date(vcache.oldest) <= floor;
  const stopAt = covered && vcache.newest ? new Date(vcache.newest) : floor;
  let token = '', pages = 0, newest = null, oldest = null;
  while (pages < 40) {
    const j = await yt('/playlistItems', { part:'snippet', playlistId: pl, maxResults: 50, ...(token ? { pageToken: token } : {}) });
    pages++;
    let done = false;
    for (const it of j.items || []) {
      const s = it.snippet || {}, id = s.resourceId && s.resourceId.videoId;
      if (!id || !s.publishedAt) continue;
      const t = new Date(s.publishedAt);
      if (!newest || t > newest) newest = t;
      if (!oldest || t < oldest) oldest = t;
      if (looksLikeHighlight(s.title || '')) {
        const th = s.thumbnails || {};
        vcache.videos[id] = { id, title: s.title, pub: s.publishedAt, thumb: (th.medium || th.high || th.default || {}).url || '' };
      }
      if (t < stopAt) done = true;
    }
    token = j.nextPageToken;
    if (done || !token) break;
  }
  if (newest && (!vcache.newest || newest > new Date(vcache.newest))) vcache.newest = newest.toISOString();
  if (oldest && (!vcache.oldest || oldest < new Date(vcache.oldest))) vcache.oldest = oldest.toISOString();
  const cutoff = Date.now() - 150 * 86400000;
  for (const [id, v] of Object.entries(vcache.videos)) if (new Date(v.pub).getTime() < cutoff) delete vcache.videos[id];
  saveV();
}

/* ---------- Match videos to games by team names ---------- */
const norm = s => ' ' + String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .replace(/&/g, ' and ').replace(/[^a-z0-9']+/g, ' ').trim() + ' ';
const ALIAS_RAW = {
  'Manchester United':['Man United','Man Utd','Manchester Utd'],
  'Manchester City':['Man City'],
  'Tottenham Hotspur':['Tottenham','Spurs'],
  'Wolverhampton Wanderers':['Wolves','Wolverhampton'],
  'Brighton & Hove Albion':['Brighton'],
  'AFC Bournemouth':['Bournemouth'],
  'Nottingham Forest':["Nott'm Forest",'Forest'],
  'West Ham United':['West Ham'],
  'Newcastle United':['Newcastle'],
  'Leeds United':['Leeds'],
  'Sheffield United':['Sheffield Utd','Sheff Utd'],
  'Sheffield Wednesday':['Sheff Wed'],
  'Leicester City':['Leicester'],
  'Ipswich Town':['Ipswich'],
  'Crystal Palace':['Palace'],
  'Aston Villa':['Villa'],
  'West Bromwich Albion':['West Brom'],
  'Queens Park Rangers':['QPR'],
  'Norwich City':['Norwich'],
  'Coventry City':['Coventry'],
  'Hull City':['Hull'],
  'Stoke City':['Stoke'],
  'Cardiff City':['Cardiff'],
  'Swansea City':['Swansea'],
  'Middlesbrough':['Boro']
};
const ALIAS = {};
for (const [k, v] of Object.entries(ALIAS_RAW)) ALIAS[norm(k).trim()] = v.map(a => norm(a).trim());
const SKIP_FIRST = new Set(['manchester','west','sheffield','aston','crystal','nottingham','queens','afc','fc']);
const aliasMemo = {};
function aliases(t){
  if (aliasMemo[t.name]) return aliasMemo[t.name];
  const key = norm(t.name).trim();
  const set = new Set([key, norm(t.short).trim(), norm(t.location).trim(), key.replace(/^(afc|fc) | (afc|fc)$/g, '')]);
  (ALIAS[key] || []).forEach(a => set.add(a));
  const first = key.split(' ')[0];
  if (first.length >= 4 && !SKIP_FIRST.has(first)) set.add(first);
  return aliasMemo[t.name] = [...set].filter(a => a.length >= 3);
}
function findVideos(g){
  const ha = aliases(g.home), aa = aliases(g.away);
  const lo = g.date.getTime() - 3 * 3600e3, hi = g.date.getTime() + 6 * 86400e3;
  let ext = null, short = null;
  for (const v of Object.values(vcache.videos)) {
    const t = new Date(v.pub).getTime();
    if (t < lo || t > hi) continue;
    const n = norm(v.title);
    if (!ha.some(a => n.includes(' ' + a + ' ')) || !aa.some(a => n.includes(' ' + a + ' '))) continue;
    if (/extended/i.test(v.title)) { if (!ext || t < new Date(ext.pub).getTime()) ext = v; }
    else if (!/condensed|reaction|preview|analysis/i.test(v.title)) { if (!short) short = v; }
  }
  return { ext, short };
}

/* ---------- Render ---------- */
function render(){
  const win = windowFor(weekOffset);
  $('#range').textContent = fmtRange(win);
  $('#todayBtn').hidden = weekOffset === 0;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.f === filter));

  $('#banner').innerHTML = settings.apiKey ? '' :
    `<div class="banner">Add a YouTube API key to pull in the NBC Sports videos. <button data-act="settings">Open settings</button></div>`;

  const rows = games.map(g => ({ g, v: findVideos(g) }));
  const done = games.filter(g => watched[g.id]).length;
  $('#progText').textContent = games.length ? `${done} of ${games.length} watched` : 'No matches';
  $('#progBar').style.width = games.length ? (done / games.length * 100) + '%' : '0';

  const shown = rows.filter(({ g, v }) =>
    filter === 'all' ? true : filter === 'unwatched' ? !watched[g.id] : (v.ext && !watched[g.id]));

  if (!games.length) { $('#list').innerHTML = `<div class="empty-state">${loading ? 'Loading matches…' : 'No Premier League matches this week.'}</div>`; return; }
  if (!shown.length) { $('#list').innerHTML = `<div class="empty-state">${filter === 'ready' ? 'Nothing new to watch yet.' : 'All caught up.'}</div>`; return; }

  let html = '', lastDay = '';
  for (const r of shown) {
    const day = r.g.date.toLocaleDateString([], { weekday:'long', month:'short', day:'numeric' });
    if (day !== lastDay) { html += `<div class="day">${esc(day)}</div>`; lastDay = day; }
    html += card(r);
  }
  $('#list').innerHTML = html;
}

function card({ g, v }){
  const w = !!watched[g.id];
  const started = g.state !== 'pre';
  const showScore = started && (!settings.hideScores || w || revealed[g.id]);
  const hidden = started && !showScore;
  const hs = Number(g.home.score), as = Number(g.away.score);
  const winner = showScore && g.completed ? (hs > as ? 'h' : as > hs ? 'a' : '') : '';
  const team = (t, side) => `<div class="team ${winner && winner !== side ? 'lose' : ''}">
      ${t.logo ? `<img src="${esc(t.logo)}" alt="" loading="lazy">` : '<span class="nologo"></span>'}
      <span class="tn">${esc(t.short)}</span>
      <span class="sc">${!started ? '' : showScore ? esc(t.score) : '<span class="q"></span>'}</span></div>`;
  const time = g.date.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });

  let status;
  if (!started) status = `Kicks off ${esc(time)}`;
  else if (g.state === 'in') status = `<span class="live">LIVE</span> ${esc(g.detail)}`;
  else status = esc(g.detail || 'FT');
  if (hidden) status += ' · tap to see score';

  let thumb;
  if (v.ext) thumb = `<a class="thumb" href="https://www.youtube.com/watch?v=${esc(v.ext.id)}" target="_blank" rel="noopener">
      ${v.ext.thumb ? `<img src="${esc(v.ext.thumb)}" alt="" loading="lazy">` : ''}<span class="play"></span><span class="badge">EXTENDED</span></a>`;
  else if (g.completed) thumb = `<div class="thumb empty">${settings.apiKey ? 'Waiting for video…' : 'Add API key'}</div>`;
  else if (g.state === 'in') thumb = `<div class="thumb empty">In progress</div>`;
  else thumb = `<div class="thumb empty">${esc(time)}</div>`;

  const shortLink = !v.ext && v.short
    ? ` · <a class="short" href="https://www.youtube.com/watch?v=${esc(v.short.id)}" target="_blank" rel="noopener">Short highlights</a>` : '';

  return `<div class="card ${w ? 'done' : ''}">
    <div class="row">
      <div class="teams" ${hidden ? `data-act="reveal" data-id="${esc(g.id)}"` : ''}>${team(g.home, 'h')}${team(g.away, 'a')}</div>
      ${thumb}
    </div>
    <div class="foot">
      <span class="st">${status}${shortLink}</span>
      <button class="watch ${w ? 'on' : ''}" data-act="watch" data-id="${esc(g.id)}"><span class="ck"></span>${w ? 'Watched' : 'Watched?'}</button>
    </div>
  </div>`;
}

function setStatus(msg, err){ const s = $('#status'); s.textContent = msg; s.classList.toggle('err', !!err); }

/* ---------- Refresh loop ---------- */
async function refresh(force){
  if (loading) return;
  loading = true; $('#refreshBtn').classList.add('spin');
  const win = windowFor(weekOffset), myOffset = weekOffset;
  let ytErr = null;
  try {
    const g = await fetchGames(win);
    if (myOffset !== weekOffset) return;
    games = g; render();
    if (settings.apiKey) {
      const need = games.some(x => x.completed && !findVideos(x).ext);
      const covered = vcache.oldest && new Date(vcache.oldest) <= new Date(win.start.getTime() - 86400000);
      if (need && (force || !covered || Date.now() - lastYT > 120000)) {
        lastYT = Date.now();
        try { await scanVideos(win); } catch (e) { ytErr = e; }
        render();
      }
    }
    const t = new Date().toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
    ytErr ? setStatus(ytErr.message, true) : setStatus('Updated ' + t);
  } catch (e) {
    setStatus(e.message || 'Something went wrong', true);
  } finally {
    loading = false; $('#refreshBtn').classList.remove('spin');
    lastRefresh = Date.now(); render(); schedule();
  }
}
function schedule(){
  clearTimeout(timer);
  const live = games.some(g => g.state === 'in');
  const mins = live ? 1 : Number(settings.refreshMin) || 5;
  timer = setTimeout(() => document.visibilityState === 'visible' ? refresh() : schedule(), mins * 60000);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Date.now() - lastRefresh > 60000) refresh();
});

/* ---------- Interactions ---------- */
$('#refreshBtn').addEventListener('click', () => refresh(true));
function goWeek(o){ weekOffset = o; games = []; revealed = {}; render(); refresh(); }
function openSettings(){
  $('#apiKey').value = settings.apiKey; $('#handle').value = settings.handle;
  $('#hideScores').checked = settings.hideScores; $('#refreshMin').value = String(settings.refreshMin);
  $('#sheet').classList.add('open');
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === 'watch') { watched[id] ? delete watched[id] : (watched[id] = Date.now()); LS.set('plh.watched', watched); render(); }
  else if (act === 'reveal') { revealed[id] = true; render(); }
  else if (act === 'filter') { filter = el.dataset.f; render(); }
  else if (act === 'prev') goWeek(weekOffset - 1);
  else if (act === 'next') goWeek(weekOffset + 1);
  else if (act === 'today') goWeek(0);
  else if (act === 'settings') openSettings();
  else if (act === 'closeSettings') $('#sheet').classList.remove('open');
  else if (act === 'saveSettings') {
    settings.apiKey = $('#apiKey').value.trim();
    settings.handle = $('#handle').value.trim() || '@NBCSports';
    if (!settings.handle.startsWith('@')) settings.handle = '@' + settings.handle;
    settings.hideScores = $('#hideScores').checked;
    settings.refreshMin = Number($('#refreshMin').value);
    LS.set('plh.settings', settings);
    $('#sheet').classList.remove('open');
    render(); refresh(true);
  }
  else if (act === 'resetCache') {
    vcache = { uploads:null, handle:null, videos:{}, newest:null, oldest:null }; saveV();
    $('#sheet').classList.remove('open'); render(); refresh(true);
  }
});
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') $('#sheet').classList.remove('open'); });

render();
refresh();
</script>
</body>
